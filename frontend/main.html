<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xylo</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <script src="js/tema.js"></script>
</head>

<body>
    <div class="app">

        <!-- Menu lateral -->
        <aside class="menu" id="menu">
            <div class="menu-topo" data-recarregar title="Recarregar a página">
                <div class="logo-icone"><svg class="xylo-marca" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><rect x="9.9" y="1.6" width="4.2" height="20.8" rx="2.1" fill="currentColor" transform="rotate(45 12 12)"/><rect x="9.9" y="1.6" width="4.2" height="20.8" rx="2.1" fill="currentColor" opacity=".72" transform="rotate(-45 12 12)"/><circle cx="12" cy="12" r="1.5" fill="#3fae74"/></svg></div>
                <span class="logo-texto">Xylo</span>
            </div>

            <nav class="menu-itens">
                <a href="#inicio" data-rota="inicio"><i class="fas fa-house"></i> Início</a>

                <div class="menu-titulo">Cadastros</div>
                <a href="#clientes" data-rota="clientes"><i class="fas fa-handshake"></i> Clientes</a>
                <a href="#florestas" data-rota="florestas"><i class="fas fa-tree"></i> Florestas</a>
                <a href="#empreiteiros" data-rota="empreiteiros"><i class="fas fa-helmet-safety"></i> Empreiteiros</a>
                <a href="#rotas" data-rota="rotas" data-pode-editar><i class="fas fa-map-signs"></i> Rotas e distâncias</a>
                <a href="#importar" data-rota="importar" data-pode-editar><i class="fas fa-file-import"></i> Importar planilha</a>

                <div class="menu-titulo">Operação</div>
                <a href="#viagens" data-rota="viagens"><i class="fas fa-route"></i> Viagens</a>
                <a href="#fretes" data-rota="fretes"><i class="fas fa-truck"></i> Fretes</a>
                <a href="#despesas" data-rota="despesas"><i class="fas fa-file-invoice-dollar"></i> Despesas</a>
                <a href="#relatorios" data-rota="relatorios"><i class="fas fa-chart-pie"></i> Relatórios</a>

                <div class="menu-titulo" data-pode-editar>Pessoal</div>
                <a href="#funcionarios" data-rota="funcionarios" data-pode-editar><i class="fas fa-id-card"></i> Funcionários</a>
                <a href="#folha" data-rota="folha" data-pode-editar><i class="fas fa-money-check-dollar"></i> Folha de pagamento</a>

                <div class="menu-titulo" data-somente-admin>Administração</div>
                <a href="#financeiro" data-rota="financeiro" data-somente-admin><i class="fas fa-receipt"></i> Financeiro <span class="badge" id="badge-fatura"></span></a>
                <a href="#usuarios" data-rota="usuarios" data-somente-admin><i class="fas fa-users-gear"></i> Usuários</a>
                <a href="#historico" data-rota="historico" data-somente-admin><i class="fas fa-clock-rotate-left"></i> Histórico</a>
                <a href="#lixeira" data-rota="lixeira" data-somente-admin><i class="fas fa-trash-can"></i> Lixeira</a>
            </nav>
        </aside>

        <div class="principal">

            <!-- Barra superior -->
            <header class="topo">
                <button type="button" class="icone-botao so-mobile" id="btn-menu" aria-label="Abrir menu">
                    <i class="fas fa-bars"></i>
                </button>

                <h1 id="titulo-pagina">Início</h1>

                <div class="topo-direita">
                    <!-- Data e hora (atualiza sozinha) -->
                    <time class="relogio" id="relogio" aria-live="off"></time>

                    <!-- Empresa: logo e nome -->
                    <div class="empresa-topo" id="empresa-topo">
                        <img id="logo-empresa" alt="" hidden>
                        <span id="info-empresa"></span>
                    </div>

                    <!-- Aparência: tema claro/escuro e cor de fundo (js/tema.js) -->
                    <div class="aparencia" id="aparencia"></div>

                    <!-- Menu do usuário: Meu perfil, Dados da empresa (admin) e Sair -->
                    <div class="usuario-topo">
                        <button type="button" class="botao-usuario" id="btn-usuario" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-usuario">
                            <span class="avatar" id="avatar-usuario" aria-hidden="true"></span>
                            <span class="quem some-mobile">
                                <strong id="info-usuario"></strong>
                                <span id="info-perfil"></span>
                            </span>
                            <span class="seta" aria-hidden="true">▾</span>
                        </button>
                        <div class="menu-suspenso" id="menu-usuario" role="menu" hidden>
                            <div class="menu-suspenso-topo">
                                <strong id="menu-nome"></strong>
                                <span id="menu-email"></span>
                            </div>
                            <a href="#perfil" role="menuitem"><i class="fas fa-user"></i> Meu perfil</a>
                            <a href="#empresa" role="menuitem" data-somente-admin><i class="fas fa-building"></i> Dados da empresa</a>
                            <a href="#usuarios" role="menuitem" data-somente-admin><i class="fas fa-users-gear"></i> Usuários</a>
                            <button type="button" role="menuitem" id="btn-sair"><i class="fas fa-right-from-bracket"></i> Sair</button>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Aqui o main.js desenha cada tela -->
            <main class="conteudo" id="conteudo"></main>
        </div>
    </div>

    <!-- Janela (modal) usada pelos formulários -->
    <div class="modal-fundo" id="modal" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
            <div class="modal-cabecalho">
                <h2 id="modal-titulo"></h2>
                <button type="button" class="icone-botao" id="modal-fechar" aria-label="Fechar">
                    <i class="fas fa-xmark"></i>
                </button>
            </div>
            <div class="modal-corpo" id="modal-corpo"></div>
        </div>
    </div>

    <!-- Aviso rápido no canto da tela -->
    <div class="toast" id="toast" role="status" hidden></div>

    <!-- Funções compartilhadas: carregar antes dos outros scripts -->
    <script src="js/comum.js"></script>
    <script src="js/tabelas.js"></script>
    <script src="js/api.js"></script>
    <script src="js/graficos.js"></script>
    <script src="js/ticket.js"></script>
    <script src="js/viagens.js"></script>
    <script src="js/fretes.js"></script>
    <script src="js/despesas.js"></script>
    <script src="js/relatorios.js"></script>
    <script src="js/dre.js"></script>
    <script src="js/inicio.js"></script>
    <script src="js/perfil.js"></script>
    <script src="js/importar.js"></script>
    <script src="js/funcionarios.js"></script>
    <script src="js/rotas.js"></script>
    <script src="js/folha.js"></script>
    <script src="js/auditoria.js"></script>
    <script src="js/qrcode.js"></script>
    <script src="js/financeiro.js"></script>
    <script src="js/main.js"></script>
    <script src="js/assistente.js"></script>
</body>
</html>
